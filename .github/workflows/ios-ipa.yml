name: AION MOBILE unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: aion-mobile-ios
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Check out upstream AionUi source
        uses: actions/checkout@v4
        with:
          repository: iOfficeAI/AionUi
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/mobile/package.json

      - name: Prepare AION MOBILE workspace
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p mobile/_workspace/src
          cp -R src/common mobile/_workspace/src/common
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("mobile/metro.config.js")
          s = p.read_text()
          s = s.replace("path.resolve(projectRoot, '..')", "path.resolve(projectRoot, '_workspace')")
          p.write_text(s)
          p = Path("mobile/app.config.ts")
          s = p.read_text()
          s = s.replace("name: 'AionUi Mobile'", "name: 'AION MOBILE'")
          s = s.replace("ai.resopod.aionui", "com.moha700m.aionmobile")
          s = re.sub(r"projectId: '[^']+'", "projectId: undefined", s)
          p.write_text(s)
          PY

      - name: Install JavaScript dependencies
        working-directory: upstream/mobile
        run: npm install --no-audit --no-fund

      - name: Generate native iOS project
        working-directory: upstream/mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: upstream/mobile/ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: upstream/mobile
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          xcodebuild -list -json -workspace "$WORKSPACE" > /tmp/aion-xcode-list.json
          SCHEME="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/aion-xcode-list.json'))
          schemes=d.get('workspace',{}).get('schemes',[])
          if not schemes:
              raise SystemExit('No Xcode scheme found')
          print(schemes[0])
          PY
          )"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$PWD/build/ipa/Payload"
          cp -R "$APP_PATH" "$PWD/build/ipa/Payload/AION MOBILE.app"
          ditto -c -k --sequesterRsrc --keepParent "$PWD/build/ipa/Payload" "$PWD/build/AION-MOBILE-unsigned.ipa"
          test -s "$PWD/build/AION-MOBILE-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AION-MOBILE-unsigned-IPA
          path: upstream/mobile/build/AION-MOBILE-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
