name: AION MOBILE iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: aion-mobile-ios
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate build credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Add EXPO_TOKEN in Settings > Secrets and variables > Actions."; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo "::error::Add EXPO_PROJECT_ID in Settings > Secrets and variables > Actions > Variables."; exit 1; }

      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Check out upstream AionUi source
        uses: actions/checkout@v4
        with:
          repository: iOfficeAI/AionUi
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Prepare the mobile workspace
        working-directory: upstream
        env:
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: |
          set -euo pipefail
          # The mobile app imports shared pure utilities from the monorepo root.
          mkdir -p mobile/_workspace/src
          cp -R src/common mobile/_workspace/src/common
          # Point Metro at the packaged shared source so the EAS upload is self-contained.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mobile/metro.config.js")
          s = p.read_text()
          s = s.replace("path.resolve(projectRoot, '..')", "path.resolve(projectRoot, '_workspace')")
          p.write_text(s)
          # Use this fork's own EAS project and bundle identifier, never the upstream owner's.
          p = Path("mobile/app.config.ts")
          s = p.read_text()
          s = s.replace("ai.resopod.aionui", "com.moha700m.aionmobile")
          import re, os
          s = re.sub(r"projectId:\s*'[^']+'", "projectId: process.env.EXPO_PROJECT_ID || ''", s)
          p.write_text(s)
          # Add a device-installable internal profile; no TestFlight submission is performed.
          import json
          p = Path("mobile/eas.json")
          data = json.loads(p.read_text())
          data.setdefault("build", {})["aion-internal"] = {
            "distribution": "internal",
            "channel": "preview",
            "ios": {"image": "latest"}
          }
          data.pop("submit", None)
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/mobile/package.json

      - name: Install mobile dependencies
        working-directory: upstream/mobile
        run: npm install --no-audit --no-fund

      - name: Build signed iOS IPA with EAS
        working-directory: upstream/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
        run: npx eas-cli@latest build --platform ios --profile aion-internal --non-interactive --wait

      - name: Report build result
        if: always()
        run: echo "Check the EAS build URL printed in the previous step. The IPA is hosted by EAS; this workflow does not submit it to Apple.";
